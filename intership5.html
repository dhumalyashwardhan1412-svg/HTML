<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: lightgray;
        }

        @media (max-width: 600px) {
            body {
                background-color: lightyellow;
            }
        }
        .parent{
            width: 300px;
            height: 200px;
            background-color: lightblue;
            
            position: relative;
            left: 100px;
            top: 100px;
        }
        .child{
            width: 150px;
            height: 100px;
            background-color: lightcoral;
            
            position: absolute;
            left: 50px;
            top: 50px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <p>1</p>
        <p>2</p>
        <div class="child">
            <p>3</p>
            <p>4</p>
        </div>
    </div>
</body>
</html>
