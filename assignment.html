<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        label {
            color: black;
            padding: 7px;
        }
    </style>
</head>
<body>
    <h1 style="margin-left: 30%;color: darkblue;">Student Registration Form</h1>
    <form action="?" method="get" style="margin-left:20% ;">
        <label for="Full Name">Full Name:</label><br>
        <input style="width: 350px; height: 30px;" type="text" id="Full Name" name="Full Name"><br>
        <label for="email">Email:</label><br>
        <input style="width: 350px; height: 30px;" type="email" id="email" name="email"><br>
        <label for="password">Password:</label><br>
        <input style="width: 350px; height: 30px;"  type="password" id="password" name="password"><br>
        <label for="Phone Number">Phone Number:</label><br>
        <input style="width: 350px; height: 30px;" type="tel" id="Phone Number" name="Phone Number"><br>
        <label for="Birth Date">Birth Date:</label><br>
        <input style="width: 350px; height: 30px;" type="date" id="Birth Date" name="Birth Date"><br>
        <label for="select">Select Course:</label><br>
        <select id="select" name="select" style="width: 350px; height: 30px;">
            <option value="web development">Web Development</option>
            <option value="data science">Data Science</option>
            <option value="cyber security">Cyber Security</option>
        </select><br><br>
        <label for="select gender">Select Gender:</label><br>
        <select id="select gender" name="select gender" style="width: 350px; height: 30px;">
            <option value="male">Male</option>
            <option value="female"> Female</option>
            <option value="other">Other</option>
        </select><br><br>
        <label for="enter address"  >Enter Address:</label><br>
        <textarea id="enter address" name="enter address" rows="4" cols="50" style="width: 350px; height: 60px;">
        </textarea><br><br>
        <input type="submit" value="Submit">
    </form>
    
<table border="1" width="60%" height="200" style="margin-left:20%;"> 
    <h1 style="margin-left: 30%;color: darkblue;">
        Student Data Table
    </h1>
    <tr style="background-color:darkblue; color:white;">
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>City</th>
    </tr>

        <td>1412</td>

    </tr>

        <td>2323</td>

    </tr>
    
</table>
</body>
</html>
