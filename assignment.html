<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
   <h1>Student Registration Form</h1>
    <form action="?" method="get" style="margin-left:10%;">
        <label for="Full Name">Full Name:</label><br>
        <input type="text" id="Full Name" name="Full Name"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br>
        <label for="Phone Number">Phone Number:</label><br>
        <input type="tel" id="Phone Number" name="Phone Number"><br>
        <label for="Birth Date">Birth Date:</label><br>
        <input type="date" id="Birth Date" name="Birth Date"><br>
        <label for="select">Select Course:</label><br>
        <select id="select" name="select">
        <label for="select gender">Select Gender:</label><br>
        <select id="select gender" name="select gender">
            <option value="male">Male</option>
            <option value="female"> Female</option>
            <option value="other">Other</option>
        </select><br><br>
        <label for="enter address"  >Enter Address:</label><br>
        <textarea id="enter address" name="enter address" rows="4" cols="50">
        </textarea><br><br>
        <input type="submit" value="Submit">
    </form>
    
<table> 
    <tr>
        <th>Name</th>
        <th>Employee ID</th>
        <th>City</th>
    </tr>

</body>
</html>
